# /etc/nginx/conf.d/fdroid.ccptr.dev.conf
#
# The repository is static files. Nothing executes here and no key lives here;
# the index is signed before it is ever rsynced up.

server {
    listen 80;
    listen [::]:80;
    server_name fdroid.ccptr.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fdroid.ccptr.dev;

    # certbot --nginx fills in ssl_certificate / ssl_certificate_key

    root /srv/fdroid/www;
    autoindex off;

    # An APK at a given versionCode never changes; the index does.
    location ~ \.apk$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~ /(index-v1\.jar|index-v2\.json|entry\.jar|entry\.json)$ {
        add_header Cache-Control "public, max-age=300";
    }
}
