# The apps collected into this F-Droid repository.
#
# Each entry names a GitHub repository and which release to take the APK from.
# An app repository's only obligation is to attach its signed APKs to the
# release, under any name and one per ABI if it splits them; every .apk asset
# is taken, and one whose package is not the entry's id is refused. How it
# builds and signs them is its own business, which is what lets apps of
# different stacks share this repo.
#
#   release: latest    the newest non-prerelease
#   release: <tag>     a specific tag, typically a rolling one like `nightly`
#
# signer is the SHA-256 of the certificate the app is signed with, lowercase
# hex without colons. It is checked before an APK is accepted and written into
# the metadata as AllowedAPKSigningKeys, so fdroid enforces it too. Get it with:
#
#   keytool -list -v -keystore <key>.p12 -alias <alias> \
#     | sed -n 's/.*SHA256: //p' | tr -d ':' | tr 'A-Z' 'a-z'
#
# An empty signer means "not pinned yet" and is accepted with a warning. Fill
# it in as soon as the app's key exists: it is the only thing standing between
# a compromised app repository and a malicious APK in this index.
#
# This list is the whole repository: an app that is not here is deleted from
# the server, APKs, archive and all, on the next publish.

apps:
  - id: dev.ccptr.Snot
    repo: ccptr/snot
    release: latest
    signer: "0d1d9c2b3cf424d394e7e71a6ed8691ead530a906f07820c257d0e19e7dba3a1"
