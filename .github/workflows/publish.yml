# Rebuilds and deploys the F-Droid index.
#
# This is the only workflow that holds the repository's index key and the
# deploy key, and the only one that writes to the web root. App repositories
# build and sign their own APKs and publish them as GitHub Release assets;
# this collects them. That split means a compromise of one app repository
# yields that app's signing key alone — not the index, and not the server.
#
# It is also the only place that deploys, so its concurrency group is enough
# to stop two apps racing each other's index, which per-app publishing could
# never guarantee across repositories.

name: publish

on:
  repository_dispatch:
    types: [publish]
  workflow_dispatch:
  schedule:
    # A safety net for app repos that cannot send a dispatch, and a way to
    # notice a release that was published while this was failing.
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: fdroid-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install apksigner
        run: sdkmanager --install "build-tools;36.0.0"

      - name: Install fdroidserver
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --upgrade pip
          "$RUNNER_TEMP/venv/bin/pip" install --quiet fdroidserver
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Unpack the index key
        env:
          FDROID_KEYSTORE_B64: ${{ secrets.FDROID_KEYSTORE_B64 }}
          SERVERWEBROOT: ${{ vars.FDROID_SERVERWEBROOT }}
          REPO_URL: ${{ vars.FDROID_REPO_URL }}
        run: |
          set -euo pipefail
          # An unset secret decodes to an empty file that exists, so the run
          # would limp on and fail deep inside fdroid instead of saying why.
          missing=""
          [ -n "${FDROID_KEYSTORE_B64:-}" ] || missing="$missing FDROID_KEYSTORE_B64"
          [ -n "${SERVERWEBROOT:-}" ]       || missing="$missing FDROID_SERVERWEBROOT"
          [ -n "${REPO_URL:-}" ]            || missing="$missing FDROID_REPO_URL"
          if [ -n "$missing" ]; then
            echo "::error::not configured yet, missing:$missing"
            exit 1
          fi
          umask 077
          printf '%s' "$FDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/index.p12"

      - name: Authorise the deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KEY_PASS: ${{ secrets.DEPLOY_SSH_KEY_PASS }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          # Pin the host key rather than accepting whatever answers.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

          # A passphrase-protected key cannot be used unattended without an
          # agent. The helper reads the passphrase from the environment, so it
          # reaches neither argv nor disk.
          if [ -n "${DEPLOY_SSH_KEY_PASS:-}" ]; then
            cat > "$RUNNER_TEMP/askpass" <<'EOS'
          #!/bin/sh
          printf '%s\n' "$DEPLOY_SSH_KEY_PASS"
          EOS
            chmod 700 "$RUNNER_TEMP/askpass"
            eval "$(ssh-agent -s)" > /dev/null
            SSH_ASKPASS="$RUNNER_TEMP/askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=:0 \
              ssh-add ~/.ssh/id_ed25519 < /dev/null
            rm -f "$RUNNER_TEMP/askpass"
            # Later steps rsync, so they need the agent too.
            echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
            echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          fi

      - name: Pull the published repo down
        env:
          SERVERWEBROOT: ${{ vars.FDROID_SERVERWEBROOT }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/fdroid"
          mkdir -p "$work/repo" "$work/archive"
          # fdroid update needs what is already published to write a complete
          # index and to decide what rolls into the archive.
          rsync -az "${SERVERWEBROOT}repo/"    "$work/repo/"    || echo "no repo/ yet"
          rsync -az "${SERVERWEBROOT}archive/" "$work/archive/" || echo "no archive/ yet"

      - name: Collect the apps
        env:
          # Public release assets need no special token. If an app repo is
          # private, this must be a PAT with contents:read on that repo.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bt="$ANDROID_HOME/build-tools/36.0.0"
          "$RUNNER_TEMP/venv/bin/python" tools/collect.py \
            --work "$RUNNER_TEMP/fdroid" --apksigner "$bt/apksigner"

      - name: Write the config
        env:
          SERVERWEBROOT: ${{ vars.FDROID_SERVERWEBROOT }}
          REPO_URL: ${{ vars.FDROID_REPO_URL }}
          ARCHIVE_URL: ${{ vars.FDROID_ARCHIVE_URL }}
          REPO_NAME: ${{ vars.FDROID_REPO_NAME }}
          KEY_ALIAS: ${{ vars.FDROID_KEY_ALIAS }}
          FDROID_KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          # Built with a real serialiser: a password is arbitrary bytes and has
          # no business being pasted into a here-doc.
          python3 - "$RUNNER_TEMP/fdroid/config.yml" <<'PY'
          import json, os, sys
          cfg = {
              "repo_url": os.environ["REPO_URL"],
              "repo_name": os.environ["REPO_NAME"],
              "archive_url": os.environ["ARCHIVE_URL"],
              "archive_older": 3,
              "serverwebroot": os.environ["SERVERWEBROOT"],
              "keystore": os.path.join(os.environ["RUNNER_TEMP"], "index.p12"),
              "repo_keyalias": os.environ["KEY_ALIAS"],
              "keystorepass": os.environ["FDROID_KEYSTORE_PASS"],
              "keypass": os.environ["FDROID_KEYSTORE_PASS"],
          }
          with open(sys.argv[1], "w") as f:
              for k, v in cfg.items():
                  f.write(f"{k}: {json.dumps(v)}\n")
          PY
          chmod 600 "$RUNNER_TEMP/fdroid/config.yml"

      - name: Update the index and deploy
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/fdroid"
          fdroid update
          fdroid deploy

      - name: Destroy the keys
        if: always()
        run: shred -u "$RUNNER_TEMP/index.p12" ~/.ssh/id_ed25519 "$RUNNER_TEMP/fdroid/config.yml" 2>/dev/null || true
